services:
  - type: web
    name: wearthlybackend
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_TIME
        value: 7d
      - key: COOKIE_EXPIRES_TIME
        value: 7
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_URL
        value: https://wearthlybackend.onrender.com
      - key: SEED_SAMPLE_PRODUCTS
        value: "true"
      - key: SEED_ADMIN
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@wearthly.com
      - key: ADMIN_PASSWORD
        sync: false
